<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Signal Board — all underlyings</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0b0f14; --panel:#111722; --line:#1d2735; --tx:#d7e0ea;
          --mut:#77839a; --up:#31b06e; --dn:#e05252; --amber:#d9a441; --blue:#4a7dcf; }
  * { box-sizing:border-box; margin:0; }
  body { background:var(--bg); color:var(--tx); padding:16px;
         font:14px/1.45 -apple-system, "Segoe UI", Roboto, sans-serif; }
  h1 { font-size:18px; margin-bottom:4px; } h1 small { color:var(--mut); font-weight:400; }
  .note { color:var(--mut); font-size:12px; }
  .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-top:12px; }
  @media (max-width:980px) { .grid { grid-template-columns:1fr; } }
  .cell { background:var(--panel); border:1px solid var(--line); border-radius:8px; padding:12px; min-height:150px; }
  .cell.card { border-color:var(--amber); }
  .hd { display:flex; justify-content:space-between; align-items:baseline; }
  .sym { font-weight:700; } .mode { color:var(--mut); font-size:11px; text-transform:uppercase; letter-spacing:.5px; }
  .chip { display:inline-block; border-radius:4px; padding:1px 7px; font-size:11px; font-weight:600; }
  .avoid { background:#2a1a1a; color:var(--dn); } .wait { background:#2a2514; color:var(--amber); }
  .trade { background:#143022; color:var(--up); } .warm { background:#1a2030; color:var(--mut); }
  .scores { font-family:ui-monospace, Menlo, monospace; font-size:12px; margin:6px 0; }
  .bull { color:var(--up); } .bear { color:var(--dn); }
  .reason { color:var(--mut); font-size:12px; }
  .cardbox { margin-top:8px; border-top:1px solid var(--line); padding-top:8px; font-size:12px; }
  .cardbox b { font-size:14px; }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:2px 10px; margin-top:4px; }
  .kv span:first-child { color:var(--mut); }
  .pe { color:var(--dn); } .ce { color:var(--up); }
</style>
</head>
<body>
<h1>Signal Board <small>— every underlying, every mode · <span id="age">…</span></small></h1>
<p class="note">Read-only view of the engine's live state for NIFTY, BANKNIFTY and FINNIFTY
(the main dashboard's signal panel shows NIFTY only). Refreshes every 5 s.
Cards here are the same advisory cards the engine issues — nothing is placed from this page.</p>
<div class="grid" id="grid"></div>
<script>
const API = "http://localhost:8777";
const SYMS = ["NIFTY", "BANKNIFTY", "FINNIFTY"];
const MODES = ["intraday", "scalp", "positional"];
const $ = id => document.getElementById(id);
const fmt = (v, d=2) => v == null ? "—" : Number(v).toFixed(d);
const esc = s => String(s ?? "").replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
let lastOk = 0;

function cellHtml(sym, mode, d, err) {
  const id = `c-${sym}-${mode}`;
  if (err) return `<div class="cell" id="${id}"><div class="hd"><span class="sym">${sym}</span>
    <span class="mode">${mode}</span></div><div class="reason" style="margin-top:8px">${esc(err)}</div></div>`;
  const s = d.status || {};
  const act = (d.action || "").toLowerCase();
  const cls = act.includes("trade") || act === "enter" ? "trade" : act.includes("wait") ? "wait"
            : act.includes("avoid") ? "avoid" : "warm";
  const card = d.signal;
  let cardHtml = "";
  if (card) {
    const dir = (card.direction || "").toUpperCase();
    const left = card.valid_until ? Math.max(0, Math.round(card.valid_until - Date.now()/1000)) : null;
    cardHtml = `<div class="cardbox">
      <b class="${dir === "PE" ? "pe" : "ce"}">BUY ${dir}</b> &nbsp;<b>${esc(card.contract)}</b>
      <span class="note"> · score ${fmt(card.confidence,1)}${card.golden ? " · GOLDEN" : ""}${card.tape_state ? " · tape " + esc(card.tape_state) : ""}</span>
      <div class="kv">
        <span>entry zone</span><span>₹${fmt(card.entry_low)} – ₹${fmt(card.entry_high)}</span>
        <span>stop</span><span class="dn">₹${fmt(card.premium_sl)}${card.disaster_sl ? " · disaster ₹" + fmt(card.disaster_sl) : ""}</span>
        <span>targets</span><span class="up">₹${fmt(card.target1)} / ₹${fmt(card.target2)}${card.quick_target ? " · quick ₹" + fmt(card.quick_target) : ""}</span>
        <span>size</span><span>${card.suggested_lots != null ? card.suggested_lots + " lot(s)" : "—"} <span class="note">${esc(card.sizing_note || "")}</span></span>
        <span>valid</span><span>${left == null ? "—" : left > 0 ? Math.floor(left/60) + "m " + (left%60) + "s left" : "expired"}</span>
      </div></div>`;
  }
  return `<div class="cell ${card ? "card" : ""}" id="${id}">
    <div class="hd"><span class="sym">${sym}</span><span class="mode">${mode}</span></div>
    <div style="margin-top:4px">${esc(s.regime_label || "—")} <span class="note">· ${esc(s.bias || "")}</span>
      &nbsp;<span class="chip ${cls}">${esc(d.action || "warming up")}</span></div>
    <div class="scores">bull <span class="bull">${fmt(s.bull_score,1)}</span> · bear <span class="bear">${fmt(s.bear_score,1)}</span>
      · vix ${esc(s.vix_status || "")} · news ${esc(s.news_label || "")}</div>
    <div class="reason">${esc(d.no_trade_reason || s.headline || "")}</div>
    ${cardHtml}</div>`;
}

async function tick() {
  const parts = [];
  for (const sym of SYMS) for (const mode of MODES) {
    try {
      const r = await fetch(`${API}/signals/${sym}?mode=${mode}`, {cache: "no-store"});
      if (r.status === 503) { parts.push(cellHtml(sym, mode, null, "warming up — no evaluation yet")); continue; }
      if (!r.ok) { parts.push(cellHtml(sym, mode, null, `HTTP ${r.status}`)); continue; }
      parts.push(cellHtml(sym, mode, await r.json(), null)); lastOk = Date.now();
    } catch (e) { parts.push(cellHtml(sym, mode, null, "backend unreachable")); }
  }
  $("grid").innerHTML = parts.join("");
}
tick(); setInterval(tick, 5000);
setInterval(() => { $("age").textContent = lastOk ? `live · ${Math.round((Date.now()-lastOk)/1000)}s ago` : "connecting…"; }, 1000);
</script>
</body>
</html>
